name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: "EN Java SpringMVC"
            path: "en/java-springmvc"
          - name: "EN Java WebFlux"
            path: "en/java-spring-webflux"
          - name: "EN Java Feign"
            path: "en/java-feign"
          - name: "EN Java JAX-RS"
            path: "en/java-jaxrs"
          - name: "EN Kotlin SpringMVC"
            path: "en/kotlin-springmvc"
          - name: "CN Java SpringMVC"
            path: "cn/java-springmvc"
          - name: "CN Java WebFlux"
            path: "cn/java-spring-webflux"
          - name: "CN Java Feign"
            path: "cn/java-feign"
          - name: "CN Java JAX-RS"
            path: "cn/java-jaxrs"
          - name: "CN Kotlin SpringMVC"
            path: "cn/kotlin-springmvc"

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and Test ${{ matrix.project.name }}
      run: |
        echo "Building: ${{ matrix.project.name }}"
        echo "Path: ${{ matrix.project.path }}"
        cd ${{ matrix.project.path }}
        mvn clean verify

    - name: Upload Build Artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ matrix.project.path }}
        path: |
          ${{ matrix.project.path }}/target/
          !${{ matrix.project.path }}/target/*.jar
        retention-days: 5

  build-summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check Build Results
      run: |
        echo "========================================="
        echo "Build Summary"
        echo "========================================="
        echo "All projects have been built."
        echo "Check individual job results above for details."
        echo "========================================="
